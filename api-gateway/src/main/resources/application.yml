server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: libros-route
          uri: lb://libros-service
          predicates:
            - Path=/api/v1/libros/**

        - id: socios-route
          uri: lb://libros-service
          predicates:
            - Path=/api/v1/socios/**

        - id: prestamos-route
          uri: lb://prestamos-service
          predicates:
            - Path=/api/v1/prestamos/**

        - id: notificaciones-route
          uri: lb://notificaciones-service
          predicates:
            - Path=/api/v1/notificaciones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
