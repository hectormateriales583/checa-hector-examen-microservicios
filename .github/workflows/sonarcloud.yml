name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze 3 business services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Analyze libros-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd libros-service
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=hectormateriales583 \
            -Dsonar.projectKey=hectormateriales583_libros-service \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.exclusions=**/application.yml,**/application*.yml

      - name: Analyze prestamos-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd prestamos-service
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=hectormateriales583 \
            -Dsonar.projectKey=hectormateriales583_prestamos-service \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.exclusions=**/application.yml,**/application*.yml

      - name: Analyze notificaciones-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd notificaciones-service
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=hectormateriales583 \
            -Dsonar.projectKey=hectormateriales583_notificaciones-service \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.exclusions=**/application.yml,**/application*.yml
